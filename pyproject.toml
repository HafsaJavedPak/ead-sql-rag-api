[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ead-sql-rag-api"
version = "0.1.0"
description = "Authenticated FastAPI backend for the EAD SQL RAG agent"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "greenlet>=3.1,<4",
  "httpx>=0.28,<1",
  "kaleido>=0.2.1,<2",
  "langchain>=1,<2",
  "langchain-core>=1,<2",
  "langchain-groq>=1,<2",
  "langchain-openai>=1,<2",
  "langfuse>=4,<5",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "numpy>=1.26,<3",
  "orjson>=3.10,<4",
  "pandas>=2.2,<3",
  "plotly>=5.22,<7",
  "psycopg[binary]>=3.1,<4",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.7,<3",
  "PyJWT[crypto]>=2.10,<3",
  "PyMySQL>=1.1,<2",
  "python-dotenv>=1,<2",
  "sqlalchemy>=2.0.36,<3",
  "sqlglot>=25,<30",
  "sse-starlette>=3,<4",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
local = [
  "langchain-huggingface>=1,<2",
  "sentence-transformers>=5,<6",
]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]
ui = [
  "gradio>=5.49,<7",
]

[tool.setuptools.packages.find]
include = ["ead_agent*", "ead_api*", "ead_ui*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires local database services",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"ead_api/api/routers/*.py" = ["B008", "ASYNC240"]
"ead_api/dependencies.py" = ["B008"]
"ead_api/services/chat.py" = ["ASYNC240"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
